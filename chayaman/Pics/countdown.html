<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHAYAMANA — Registration Opens Soon</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: #fff;
    font-family: 'Poppins', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
    overflow-x: hidden;
    position: relative;
  }

  /* faint hexagon line pattern in the background, similar to the site */
  .mil-hex-bg {
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(60deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 80px),
      repeating-linear-gradient(-60deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 80px);
    pointer-events: none;
  }

  .content {
    position: relative;
    z-index: 1;
    max-width: 700px;
  }

  .suptitle {
    color: #ff9800;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-size: 14px;
    margin-bottom: 20px;
    font-weight: 600;
  }

  h1 {
    font-size: clamp(40px, 8vw, 90px);
    font-weight: 800;
    line-height: 1;
    margin-bottom: 10px;
    letter-spacing: -1px;
  }

  h1 span {
    font-weight: 300;
    color: #bbb;
  }

  .desc {
    color: #aaa;
    font-size: 16px;
    line-height: 1.6;
    margin: 25px auto 50px;
    max-width: 500px;
  }

  .countdown {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 50px;
  }

  .unit {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 25px 20px;
    min-width: 100px;
  }

  .unit .num {
    font-size: clamp(32px, 6vw, 52px);
    font-weight: 800;
    color: #ff9800;
    line-height: 1;
  }

  .unit .label {
    margin-top: 8px;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #888;
  }

  .cta {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: transparent;
    color: #888;
    font-weight: 700;
    text-decoration: none;
    padding: 16px 30px;
    border-radius: 40px;
    border: 1px solid rgba(255,255,255,0.15);
    font-size: 14px;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: not-allowed;
    pointer-events: none;
  }

  .cta .arrow {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    color: #888;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }

  .back-link {
    margin-top: 40px;
    color: #666;
    font-size: 13px;
    text-decoration: none;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .back-link:hover { color: #ff9800; }

  .released-msg {
    display: none;
    font-size: clamp(24px, 5vw, 36px);
    color: #ff9800;
    font-weight: 700;
    margin-bottom: 30px;
  }
</style>
</head>
<body>

  <div class="mil-hex-bg"></div>

  <div class="content">
    <div class="suptitle">CHAYAMANA &nbsp;|&nbsp; MCPAS</div>
    <h1>Registration<br><span>Opens Soon</span></h1>
    <p class="desc">
      The CHAYAMANA registration form goes live on
      <strong style="color:#fff;">1st November</strong>.
      Get ready to sign up — the countdown has begun.
    </p>

    <p class="released-msg" id="releasedMsg">Registration is now open!</p>

    <div class="countdown" id="countdown">
      <div class="unit"><div class="num" id="days">00</div><div class="label">Days</div></div>
      <div class="unit"><div class="num" id="hours">00</div><div class="label">Hours</div></div>
      <div class="unit"><div class="num" id="minutes">00</div><div class="label">Minutes</div></div>
      <div class="unit"><div class="num" id="seconds">00</div><div class="label">Seconds</div></div>
    </div>

    <span class="cta" id="ctaBtn">
      <span id="ctaText">Registration Currently Unavailable</span>
      <span class="arrow">&#10005;</span>
    </span>

    <div><a href="aaa.html" class="back-link">&larr; Back to Homepage</a></div>
  </div>

  <script>
    // Target: 1st November 2026, 00:00 local time
    var targetDate = new Date("2026-11-01T00:00:00").getTime();

    function updateCountdown() {
      var now = new Date().getTime();
      var distance = targetDate - now;

      if (distance <= 0) {
        document.getElementById('countdown').style.display = 'none';
        document.getElementById('releasedMsg').style.display = 'block';

        var btn = document.getElementById('ctaBtn');
        var newBtn = document.createElement('a');
        newBtn.href = 'https://docs.google.com/forms/d/e/1FAIpQLSc9yE9lGI3NVYepT7EJzeQDSDDARTqR4iFD-Jla0GFUQQLAmw/viewform?usp=header';
        newBtn.target = '_blank';
        newBtn.rel = 'noopener';
        newBtn.className = 'cta';
        newBtn.style.background = '#ff9800';
        newBtn.style.color = '#000';
        newBtn.style.border = 'none';
        newBtn.style.cursor = 'pointer';
        newBtn.style.pointerEvents = 'auto';
        newBtn.innerHTML = '<span>Register Now</span><span class="arrow" style="background:#000;color:#ff9800;">&#8594;</span>';
        btn.replaceWith(newBtn);

        clearInterval(timer);
        return;
      }

      var days = Math.floor(distance / (1000 * 60 * 60 * 24));
      var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      var seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById('days').textContent = String(days).padStart(2, '0');
      document.getElementById('hours').textContent = String(hours).padStart(2, '0');
      document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
      document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
    }

    updateCountdown();
    var timer = setInterval(updateCountdown, 1000);
  </script>

</body>
</html>
